agents:
  queue: hosted

steps:
  - label: ":go: Format, vet, and build"
    key: checks
    command: "bash .buildkite/check.sh"
    timeout_in_minutes: 10
    plugins:
      - docker#v5.14.0:
          image: golang:1.27.1-bookworm
          environment:
            - GOTOOLCHAIN=local
            - CGO_ENABLED=1

  - label: ":go: Tests"
    key: tests
    command: "go test -count=1 -timeout=10m ./..."
    timeout_in_minutes: 15
    plugins:
      - docker#v5.14.0:
          image: golang:1.27.1-bookworm
          environment:
            - GOTOOLCHAIN=local
            - CGO_ENABLED=1

  - label: ":go: Race tests"
    key: race
    command: "go test -race -count=1 -timeout=10m ./..."
    timeout_in_minutes: 15
    plugins:
      - docker#v5.14.0:
          image: golang:1.27.1-bookworm
          environment:
            - GOTOOLCHAIN=local
            - CGO_ENABLED=1

  - label: ":docker: Build amd64 and arm64 image"
    key: image
    command: "bash .buildkite/image.sh check"
    timeout_in_minutes: 20

  - label: ":bash: Image publishing tests"
    key: publishing-tests
    commands:
      - "bash .buildkite/image_test.sh"
      - "bash .buildkite/version_test.sh"
      - "bash .buildkite/version_check_test.sh"
    timeout_in_minutes: 5

  - label: ":label: VERSION check"
    key: version
    command: "bash .buildkite/version_check.sh"
    timeout_in_minutes: 5

  - label: ":docker: Publish build and edge tags to Docker Hub"
    key: publish
    if: 'build.branch == "main" && build.tag == null && build.pull_request.id == null'
    depends_on: [checks, tests, race, image, publishing-tests, version]
    command: "bash .buildkite/image.sh publish"
    timeout_in_minutes: 20
    concurrency: 1
    concurrency_group: "docker-hub/buildkite/oci-accelerator"

  - label: ":docker: Publish a changed VERSION to Docker Hub"
    key: release
    if: 'build.branch == "main" && build.tag == null && build.pull_request.id == null'
    depends_on: [checks, tests, race, image, publishing-tests, version]
    command: "bash .buildkite/image.sh release"
    timeout_in_minutes: 20
    concurrency: 1
    concurrency_group: "docker-hub/buildkite/oci-accelerator"
