agents:
  queue: hosted

steps:
  - label: ":go: Format, vet, and build"
    key: checks
    command: "bash .buildkite/check.sh"
    timeout_in_minutes: 10
    plugins:
      - docker#v5.14.0:
          image: golang:1.27.3-bookworm
          environment:
            - GOTOOLCHAIN=local
            - CGO_ENABLED=1

  - label: ":go: Tests"
    key: tests
    command: "apt-get update && apt-get install -y --no-install-recommends jq && go test -count=1 -timeout=10m ./..."
    timeout_in_minutes: 15
    plugins:
      - docker#v5.14.0:
          image: golang:1.27.3-bookworm
          environment:
            - GOTOOLCHAIN=local
            - CGO_ENABLED=1

  - label: ":go: Race tests"
    key: race
    command: "apt-get update && apt-get install -y --no-install-recommends jq && go test -race -count=1 -timeout=10m ./..."
    timeout_in_minutes: 15
    plugins:
      - docker#v5.14.0:
          image: golang:1.27.3-bookworm
          environment:
            - GOTOOLCHAIN=local
            - CGO_ENABLED=1

  - label: ":docker: Validate version and build amd64 and arm64 image"
    key: image
    command: "bash .buildkite/image.sh check"
    timeout_in_minutes: 20

  - label: ":go: Package Linux and macOS binaries"
    key: binaries
    command: "bash .buildkite/binaries.sh"
    timeout_in_minutes: 20
    plugins:
      - docker#v5.14.0:
          image: golang:1.27.3-bookworm
          mount-buildkite-agent: true
          environment:
            - GOTOOLCHAIN=local
            - CGO_ENABLED=0

  - block: ":package: Publish to Docker Hub and GitHub?"
    key: approve-publish
    if: 'build.branch == "main" && build.tag == null && build.pull_request.id == null'
    depends_on: [checks, tests, race, image, binaries]

  - label: ":package: Publish images and versioned GitHub release"
    key: publish
    if: 'build.branch == "main" && build.tag == null && build.pull_request.id == null'
    depends_on: [checks, tests, race, image, binaries, approve-publish]
    command: |
      set -euo pipefail
      install -m 0755 -d /etc/apt/keyrings
      curl --fail --silent --show-error --location https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /etc/apt/keyrings/githubcli-archive-keyring.gpg
      chmod a+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
      echo "deb [arch=$$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
      apt-get update
      apt-get install -y --no-install-recommends gh jq
      gh --version
      jq --version
      bash .buildkite/image.sh publish
    timeout_in_minutes: 30
    concurrency: 1
    concurrency_group: "docker-hub/buildkite/oci-accelerator"
