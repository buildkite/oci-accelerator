# OCI Accelerator configuration. Relative directories are resolved from this file.
listen: 127.0.0.1:3128
# Optional separate literal-loopback Prometheus endpoint, disabled by default.
# metrics_listen: 127.0.0.1:9090
# Remote scraping requires explicit opt-in and private network access controls.
# metrics_allow_remote: false
registries:
  - registry-1.docker.io
  - ghcr.io
  - public.ecr.aws
# Optional private HTTPS storage destinations. These do not enable interception.
redirect_allowlist: []
ca_dir: ./data/ca
# Required private cache directory. Limit includes in-progress reservations.
cache:
  dir: ./data/cache
  max_bytes: 34359738368
  max_fills: 16
  max_entries: 100000
  fill_timeout: 10m
  fill_wait_timeout: 1s
  # Process-local grants for requests carrying Authorization (including empty).
  authorization_ttl: 30s
  # Independent grant lifetime for requests without Authorization.
  anonymous_authorization_ttl: 15m
  max_authorization_entries: 10000
dial_timeout: 10s
tls_handshake_timeout: 10s
response_header_timeout: 30s
idle_timeout: 2m
shutdown_timeout: 15s
max_connections: 256
max_leaf_certificates: 256
