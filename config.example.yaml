# Docker Accelerator configuration. Relative directories are resolved from this file.
listen: 127.0.0.1:3128
registries:
  - registry-1.docker.io
  - ghcr.io
ca_dir: ./data/ca
cache:
  dir: ./data/cache
  max_bytes: 34359738368
dial_timeout: 10s
tls_handshake_timeout: 10s
response_header_timeout: 30s
idle_timeout: 2m
shutdown_timeout: 15s
max_connections: 256
max_leaf_certificates: 256
