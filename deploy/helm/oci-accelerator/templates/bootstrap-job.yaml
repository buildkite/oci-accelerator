apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "oci-accelerator.bootstrapJobName" . }}
  labels:
    {{- include "oci-accelerator.labels" . | nindent 4 }}
    app.kubernetes.io/component: bootstrap
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "oci-accelerator.labels" . | nindent 8 }}
        app.kubernetes.io/component: bootstrap
    spec:
      serviceAccountName: {{ .Release.Name }}-bootstrap
      automountServiceAccountToken: true
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: {{ include "oci-accelerator.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["bootstrap-ca", "--secret", {{ printf "%s-ca" .Release.Name | quote }}, "--configmap", {{ printf "%s-trust" .Release.Name | quote }}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
