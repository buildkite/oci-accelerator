apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "oci-accelerator.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: oci-accelerator
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/component: proxy
  ports:
    - name: proxy
      port: 3128
      targetPort: proxy
      protocol: TCP
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
    {{- end }}
