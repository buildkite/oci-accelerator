apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "oci-accelerator.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: oci-accelerator
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
      app.kubernetes.io/component: proxy
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.buildNamespace | quote }}
      ports:
        - protocol: TCP
          port: 3128
    {{- if .Values.metrics.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.metrics.namespace | quote }}
      ports:
        - protocol: TCP
          port: 9090
    {{- end }}
