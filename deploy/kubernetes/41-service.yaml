apiVersion: v1
kind: Service
metadata:
  name: oci-accelerator
  namespace: oci-accelerator
  labels:
    app.kubernetes.io/name: oci-accelerator
    app.kubernetes.io/instance: oci-accelerator
    app.kubernetes.io/component: proxy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: oci-accelerator
    app.kubernetes.io/instance: oci-accelerator
    app.kubernetes.io/component: proxy
  ports:
    - name: proxy
      port: 3128
      targetPort: proxy
      protocol: TCP
