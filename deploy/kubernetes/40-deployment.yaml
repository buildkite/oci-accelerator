apiVersion: v1
kind: ServiceAccount
metadata:
  name: oci-accelerator
  namespace: oci-accelerator
  labels:
    app.kubernetes.io/name: oci-accelerator
    app.kubernetes.io/instance: oci-accelerator
    app.kubernetes.io/component: proxy
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oci-accelerator
  namespace: oci-accelerator
  labels:
    app.kubernetes.io/name: oci-accelerator
    app.kubernetes.io/instance: oci-accelerator
    app.kubernetes.io/component: proxy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: oci-accelerator
      app.kubernetes.io/instance: oci-accelerator
      app.kubernetes.io/component: proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oci-accelerator
        app.kubernetes.io/instance: oci-accelerator
        app.kubernetes.io/component: proxy
    spec:
      serviceAccountName: oci-accelerator
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-state
          image: ghcr.io/buildkite/oci-accelerator:REPLACE_ME
          command: ["/bin/sh", "-ec"]
          args:
            - |
              mkdir -p /state/ca
              cp /ca-secret/ca.crt /state/ca/ca.crt
              cp /ca-secret/ca.key /state/ca/ca.key
              chmod 0700 /state /state/ca /cache
              chmod 0644 /state/ca/ca.crt
              chmod 0600 /state/ca/ca.key
              chown 10001:10001 /state /state/ca /state/ca/ca.crt /state/ca/ca.key /cache
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
          volumeMounts:
            - name: ca-secret
              mountPath: /ca-secret
              readOnly: true
            - name: state
              mountPath: /state
            - name: cache
              mountPath: /cache
      containers:
        - name: proxy
          image: ghcr.io/buildkite/oci-accelerator:REPLACE_ME
          args: ["--config", "/etc/oci-accelerator/config.yaml"]
          ports:
            - name: proxy
              containerPort: 3128
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          startupProbe:
            exec:
              command: ["wget", "-q", "-T", "2", "-O", "/dev/null", "http://127.0.0.1:9090/readyz"]
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command: ["wget", "-q", "-T", "2", "-O", "/dev/null", "http://127.0.0.1:9090/readyz"]
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["wget", "-q", "-T", "2", "-O", "/dev/null", "http://127.0.0.1:9090/livez"]
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/oci-accelerator
              readOnly: true
            - name: state
              mountPath: /state
            - name: cache
              mountPath: /cache
      volumes:
        - name: config
          configMap:
            name: oci-accelerator
        - name: ca-secret
          secret:
            secretName: oci-accelerator-ca
            defaultMode: 0400
        - name: state
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: cache
          persistentVolumeClaim:
            claimName: oci-accelerator-cache
