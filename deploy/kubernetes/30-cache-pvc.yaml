apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oci-accelerator-cache
  namespace: oci-accelerator
  labels:
    app.kubernetes.io/name: oci-accelerator
    app.kubernetes.io/instance: oci-accelerator
    app.kubernetes.io/component: proxy
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3
  resources:
    requests:
      storage: 50Gi
